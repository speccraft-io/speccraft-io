<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=block">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 440px; overflow: hidden; }
  text { font-family: 'IBM Plex Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
</style>
</head>
<body>
<svg width="1200" height="440" viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="85%">
      <stop offset="0%" stop-color="#17141f"/>
      <stop offset="100%" stop-color="#0e0c14"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#5c5866"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c8327f"/>
    </marker>
  </defs>
  <rect width="1200" height="440" fill="url(#glow)"/>

  <text x="60" y="58" font-size="28" font-weight="700" fill="#eceaf2">Dafny inside a TypeScript project</text>
  <text x="60" y="88" font-size="16" fill="#a39eb0">Write the function once in Dafny. The verified code is the code that ships.</text>

  <rect x="60" y="150" width="240" height="96" rx="10" fill="#17141f" stroke="#c8327f"/>
  <text x="180" y="188" font-size="19" font-weight="600" fill="#eceaf2" text-anchor="middle">Search.dfy</text>
  <text x="180" y="216" font-size="15" fill="#a39eb0" text-anchor="middle">code + requires + ensures</text>

  <rect x="380" y="150" width="240" height="96" rx="10" fill="#17141f" stroke="#44cf7e"/>
  <text x="500" y="188" font-size="19" font-weight="600" fill="#eceaf2" text-anchor="middle">dafny translate js</text>
  <text x="500" y="216" font-size="15" fill="#a39eb0" text-anchor="middle">verifies first, then compiles</text>

  <rect x="700" y="150" width="200" height="96" rx="10" fill="#17141f" stroke="#5c5866"/>
  <text x="800" y="188" font-size="19" font-weight="600" fill="#eceaf2" text-anchor="middle">search.cjs</text>
  <text x="800" y="216" font-size="15" fill="#a39eb0" text-anchor="middle">generated JavaScript</text>

  <rect x="980" y="150" width="170" height="96" rx="10" fill="#17141f" stroke="#5c5866"/>
  <text x="1065" y="188" font-size="19" font-weight="600" fill="#eceaf2" text-anchor="middle">ids.ts</text>
  <text x="1065" y="216" font-size="15" fill="#a39eb0" text-anchor="middle">typed wrapper</text>

  <rect x="380" y="320" width="240" height="70" rx="10" fill="#17141f" stroke="#c8327f"/>
  <text x="500" y="352" font-size="18" font-weight="600" fill="#eceaf2" text-anchor="middle">an error</text>
  <text x="500" y="376" font-size="15" fill="#a39eb0" text-anchor="middle">no JavaScript is written</text>

  <rect x="840" y="320" width="310" height="70" rx="10" fill="#17141f" stroke="#5c5866"/>
  <text x="995" y="352" font-size="18" font-weight="600" fill="#eceaf2" text-anchor="middle">your app and vitest</text>
  <text x="995" y="376" font-size="15" fill="#a39eb0" text-anchor="middle">import indexOfId as usual</text>

  <path d="M 300 198 L 372 198" stroke="#5c5866" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 620 198 L 692 198" stroke="#44cf7e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="656" y="186" font-size="13" fill="#74e0a1" text-anchor="middle">proved</text>
  <path d="M 900 198 L 972 198" stroke="#5c5866" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 500 246 L 500 312" stroke="#c8327f" stroke-width="2" fill="none" marker-end="url(#arrowPink)"/>
  <text x="512" y="284" font-size="13" fill="#f28dc0">not proved</text>
  <path d="M 1065 246 L 1020 312" stroke="#5c5866" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>
</body>
</html>
