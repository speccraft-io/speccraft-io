<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 620px; overflow: hidden; }
  text { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
</style>
</head>
<body>
<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="85%">
      <stop offset="0%" stop-color="#171225"/>
      <stop offset="100%" stop-color="#0b0812"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#5c5675"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f0439c"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="url(#glow)"/>

  <text x="60" y="58" font-size="28" font-weight="700" fill="#ffffff">The double charge Quint found</text>
  <text x="60" y="88" font-size="16" fill="#9a94ad">Both workers read the order before either one writes "paid"</text>
  <text x="200" y="140" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Webhook sender</text>
  <line x1="200" y1="155" x2="200" y2="600" stroke="#332e47" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="480" y="140" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Worker 1</text>
  <line x1="480" y1="155" x2="480" y2="600" stroke="#332e47" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="740" y="140" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Worker 2</text>
  <line x1="740" y1="155" x2="740" y2="600" stroke="#332e47" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="1010" y="140" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Database</text>
  <line x1="1010" y1="155" x2="1010" y2="600" stroke="#332e47" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="200" cy="195" r="7" fill="#d6d2e0"/>
  <text x="216" y="200" font-size="16" fill="#d6d2e0">1. sends delivery 1</text>
  <circle cx="200" cy="265" r="7" fill="#d6d2e0"/>
  <text x="216" y="270" font-size="16" fill="#d6d2e0">2. no reply yet: sends delivery 2</text>
  <circle cx="740" cy="335" r="7" fill="#d6d2e0"/>
  <text x="756" y="340" font-size="16" fill="#d6d2e0">3. reads status: unpaid</text>
  <circle cx="480" cy="405" r="7" fill="#d6d2e0"/>
  <text x="496" y="410" font-size="16" fill="#d6d2e0">4. reads status: unpaid</text>
  <circle cx="740" cy="475" r="7" fill="#57e07a"/>
  <text x="756" y="480" font-size="16" fill="#57e07a">5. charges card, sets paid</text>
  <circle cx="480" cy="545" r="7" fill="#f0439c"/>
  <text x="496" y="550" font-size="16" fill="#f0439c">6. charges card again</text>
  <text x="1010" y="480" font-size="15" fill="#8b86a0" text-anchor="middle">charges: 1</text>
  <text x="1010" y="550" font-size="15" fill="#f0439c" text-anchor="middle" font-weight="600">charges: 2</text>
</svg>
</body>
</html>
