<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=block">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 440px; overflow: hidden; }
  text { font-family: 'IBM Plex Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
</style>
</head>
<body>
<svg width="1200" height="440" viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="85%">
      <stop offset="0%" stop-color="#17141f"/>
      <stop offset="100%" stop-color="#0e0c14"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#5c5866"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c8327f"/>
    </marker>
  </defs>
  <rect width="1200" height="440" fill="url(#glow)"/>

  <text x="60" y="58" font-size="28" font-weight="700" fill="#eceaf2">Lean next to a TypeScript project</text>
  <text x="60" y="88" font-size="16" fill="#a39eb0">Prove a copy of the function in Lean, then check the TS code gives the same answers</text>

  <!-- TS function -->
  <rect x="60" y="150" width="250" height="96" rx="10" fill="#17141f" stroke="#5c5866"/>
  <text x="185" y="188" font-size="19" font-weight="600" fill="#eceaf2" text-anchor="middle">pricing.ts</text>
  <text x="185" y="216" font-size="15" fill="#a39eb0" text-anchor="middle">the real function</text>

  <!-- Lean copy -->
  <rect x="420" y="150" width="250" height="96" rx="10" fill="#17141f" stroke="#c8327f"/>
  <text x="545" y="188" font-size="19" font-weight="600" fill="#eceaf2" text-anchor="middle">Pricing.lean</text>
  <text x="545" y="216" font-size="15" fill="#a39eb0" text-anchor="middle">the same logic, rewritten</text>

  <!-- proofs -->
  <rect x="800" y="110" width="340" height="80" rx="10" fill="#17141f" stroke="#44cf7e"/>
  <text x="970" y="144" font-size="18" font-weight="600" fill="#eceaf2" text-anchor="middle">lake build</text>
  <text x="970" y="170" font-size="15" fill="#a39eb0" text-anchor="middle">proofs checked for every input</text>

  <!-- cases -->
  <rect x="800" y="220" width="340" height="80" rx="10" fill="#17141f" stroke="#5c5866"/>
  <text x="970" y="254" font-size="18" font-weight="600" fill="#eceaf2" text-anchor="middle">lake exe discount</text>
  <text x="970" y="280" font-size="15" fill="#a39eb0" text-anchor="middle">writes cases.json: Lean's answers</text>

  <!-- vitest -->
  <rect x="300" y="330" width="500" height="70" rx="10" fill="#17141f" stroke="#44cf7e"/>
  <text x="550" y="362" font-size="18" font-weight="600" fill="#eceaf2" text-anchor="middle">vitest</text>
  <text x="550" y="386" font-size="15" fill="#a39eb0" text-anchor="middle">the TS function must give the same answers</text>

  <path d="M 310 198 L 412 198" stroke="#c8327f" stroke-width="2" fill="none" marker-end="url(#arrowPink)"/>
  <text x="361" y="186" font-size="13" fill="#f28dc0" text-anchor="middle">rewrite</text>
  <path d="M 670 185 L 792 155" stroke="#5c5866" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 670 212 L 792 250" stroke="#5c5866" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 900 300 L 760 326" stroke="#5c5866" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 185 246 L 360 326" stroke="#5c5866" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>
</body>
</html>
