<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=block">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 900px; overflow: hidden; }
  text { font-family: 'IBM Plex Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
</style>
</head>
<body>
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="85%">
      <stop offset="0%" stop-color="#17141f"/>
      <stop offset="100%" stop-color="#0e0c14"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#5c5866"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- title -->
  <text x="80" y="64" font-size="30" font-weight="700" fill="#eceaf2">TypeScript tools</text>
  <text x="80" y="94" font-size="16" fill="#a39eb0">The tools a TypeScript team can use, by how the spec is written and how it is checked</text>

  <!-- plot area: x 140..1120, y 140..790 -->

  <!-- quadrant zone labels -->
  <text x="170" y="180" font-size="14" font-weight="600" fill="#5c5866" letter-spacing="1">SPEC LANGUAGES, USED FROM TS</text>
  <text x="1090" y="180" font-size="14" font-weight="600" fill="#5c5866" letter-spacing="1" text-anchor="end">MODEL CHECKER AS A LIBRARY</text>
  <text x="1090" y="760" font-size="14" font-weight="600" fill="#5c5866" letter-spacing="1" text-anchor="end">SAMPLING, REAL CODE</text>
  <text x="170" y="760" font-size="14" font-weight="600" fill="#5c5866" letter-spacing="1">SPEC-TRACE REPLAY</text>

  <!-- axes -->
  <line x1="140" y1="465" x2="1120" y2="465" stroke="#2a2633" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="630" y1="790" x2="630" y2="140" stroke="#2a2633" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- axis labels -->
  <text x="150" y="452" font-size="15" font-weight="600" fill="#a39eb0">New spec language</text>
  <text x="1110" y="452" font-size="15" font-weight="600" fill="#a39eb0" text-anchor="end">Plain code in your language</text>
  <text x="645" y="162" font-size="15" font-weight="600" fill="#a39eb0">Exhaustive checking</text>
  <text x="645" y="782" font-size="15" font-weight="600" fill="#a39eb0">Random sampling</text>

  <!-- competitor dots: neutral ink, labels in text tokens -->
  <g fill="#a39eb0">
    <circle cx="760" cy="240" r="8"/>
    <circle cx="672" cy="290" r="8"/>
    <circle cx="672" cy="335" r="8"/>
    <circle cx="1060" cy="345" r="8"/>
    <circle cx="880" cy="375" r="8"/>
    <circle cx="730" cy="395" r="8"/>
    <circle cx="715" cy="423" r="8"/>
    <circle cx="700" cy="451" r="8"/>
    <circle cx="235" cy="250" r="8"/>
    <circle cx="290" cy="330" r="8"/>
    <circle cx="250" cy="590" r="8"/>
    <circle cx="290" cy="650" r="8"/>
    <circle cx="1060" cy="545" r="8"/>
    <circle cx="1035" cy="600" r="8"/>
    <circle cx="700" cy="610" r="8"/>
    <circle cx="912" cy="655" r="8"/>
    <circle cx="780" cy="705" r="8"/>
  </g>

  <g font-size="16" fill="#eceaf2">
    <text x="777" y="245">stifinder</text>
    <text x="689" y="295">tla-precheck (TS DSL to TLA+)</text>
    <text x="689" y="340" fill="#a39eb0">stateproof (TS to TLA+)</text>
    <text x="1043" y="350" text-anchor="end">pnueli</text>
    <text x="897" y="380">Polygraph (spec by LLM)</text>
    <text x="747" y="400">modality-ts (React)</text>
    <text x="732" y="428">effect-machine</text>
    <text x="717" y="456">XState graph</text>
    <text x="252" y="255">tla-checker (TLC in Wasm)</text>
    <text x="307" y="335">uneffect (TS comments to Quint)</text>
    <text x="267" y="595">quint-connect-ts</text>
    <text x="307" y="655">tla-connect / @fizzbee/mbt</text>
    <text x="1043" y="550" text-anchor="end">chronos / unflake / deja-dst</text>
    <text x="1052" y="605">cloudfault</text>
    <text x="717" y="615">Bombadil (real UIs)</text>
    <text x="929" y="660">fast-check</text>
    <text x="797" y="710">formalizr (model vs code)</text>
  </g>

  <!-- SpecCraft TS: a neutral dot like the others -->
  <circle cx="990" cy="268" r="8" fill="#a39eb0"/>
  <text x="973" y="273" font-size="16" fill="#eceaf2" text-anchor="end">SpecCraft TS</text>

  <!-- footer -->
  <rect x="80" y="836" width="72" height="4" rx="2" fill="#44cf7e"/>
  <text x="168" y="843" font-size="15" fill="#a39eb0">speccraft.io</text>
</svg>
</body>
</html>
