<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Checkout</title></head>
  <body>
    <h1>Checkout</h1>
    <p>1 × Coffee beans, 12.00</p>
    <label><input type="radio" name="delivery" value="standard" checked> Standard delivery</label>
    <label><input type="radio" name="delivery" value="express"> Express delivery</label>
    <button id="place-order">Place order</button>
    <p id="status"></p>
    <ul id="orders"></ul>
    <a id="continue" href="/" hidden>Continue shopping</a>
    <script src="checkout.js"></script>
  </body>
</html>
